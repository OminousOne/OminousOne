<svg xmlns="http://www.w3.org/2000/svg" width="838" height="122" viewBox="-4 0 838 122" role="img" aria-label="Julien DeWolfe started making games in Blender at nine, followed by Unity, C#, game jams, Minecraft plugins, and multiplayer networking. He studies software engineering at uOttawa and works on developer tools at Gadget.">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes bootrev{0%{opacity:0}30%{opacity:.8}55%{opacity:.15}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<g style="animation:bootrev .5s linear both;animation-delay:5.2s"><rect x="0.75" y="0.75" width="828.5" height="120.5" rx="8" fill="#211B24" stroke="#51444F" stroke-width="1.5"/><text x="22" y="34" font-size="20" fill="#F6E9D0">I made my first games in Blender at nine.</text><text x="22" y="58" font-size="15" fill="#C0B7AD">Then came Unity, C#, game jams, Minecraft plugins, and multiplayer networking.</text><text x="22" y="82" font-size="15" fill="#C0B7AD">I study software engineering at uOttawa and work on developer tools at Gadget.</text><rect x="1" y="1" width="828" height="120" rx="8" fill="url(#scan)" opacity="0.10"/></g>

</svg>