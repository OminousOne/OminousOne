<svg xmlns="http://www.w3.org/2000/svg" width="830" height="64" viewBox="0 0 830 64" role="img" aria-label="Multiplayer netcode banner with a miniature pong rally">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes bnc{0%{transform:translate(572px,40px)}25%{transform:translate(640px,20px)}50%{transform:translate(778px,34px)}75%{transform:translate(690px,46px)}100%{transform:translate(572px,40px)}}
.bnc{animation:bnc 4.6s linear infinite;}
@keyframes bncl{0%,100%{transform:translateY(38px)}40%{transform:translateY(24px)}}
@keyframes bncr{0%,100%{transform:translateY(30px)}50%{transform:translateY(36px)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<rect x="0.75" y="0.75" width="828.5" height="62.5" rx="8" fill="#0E1116" stroke="#262E36" stroke-width="1.5"/><text x="18" y="39" font-size="14" letter-spacing="2" fill="#FFB300">MULTIPLAYER NETCODE</text><text x="812" y="39" font-size="10" letter-spacing="1" fill="#46525E" text-anchor="end">C# · KUBERNETES</text><g transform="translate(-118,0)"><rect x="560" y="14" width="230" height="36" fill="#05070A" stroke="#1E262E"/><line x1="675" y1="18" x2="675" y2="46" stroke="#1E262E" stroke-dasharray="2 4"/><rect x="-2" y="-2" width="4" height="4" fill="#FFB300" class="bnc" style="transform:translate(572px,40px)"/><rect x="566" y="-7" width="3" height="14" fill="#FFB300" style="animation:bncl 4.6s ease-in-out infinite;transform:translateY(38px)"/><rect x="783" y="-7" width="3" height="14" fill="#FFB300" style="animation:bncr 4.6s ease-in-out infinite;transform:translateY(30px)"/></g>
<rect x="1" y="1" width="828" height="62" rx="10" fill="url(#scan)" opacity="0.14"/>
</svg>