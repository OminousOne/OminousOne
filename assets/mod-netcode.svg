<svg xmlns="http://www.w3.org/2000/svg" width="268" height="170" viewBox="0 0 268 170" role="img" aria-label="Netcode: a miniature multiplayer Pong court. Links to the netcode section below.">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes ncball{0%{transform:translate(26px,104px)}25%{transform:translate(134px,40px)}50%{transform:translate(240px,80px)}75%{transform:translate(114.48px,132px)}100%{transform:translate(26px,104px)}}
.ncball{animation:ncball 5.2s linear infinite;}
@keyframes ncpl{0%{transform:translateY(104px)}40%{transform:translateY(76px)}100%{transform:translateY(104px)}}
@keyframes ncpr{0%{transform:translateY(100px)}50%{transform:translateY(80px)}100%{transform:translateY(100px)}}
.ncpl{animation:ncpl 5.2s ease-in-out infinite;}
.ncpr{animation:ncpr 5.2s ease-in-out infinite;}
.nclag{animation-delay:-4.9s;}
@keyframes pwr{0%{opacity:0}18%{opacity:.85}38%{opacity:.15}62%{opacity:1}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<g style="animation:pwr .55s linear both;animation-delay:0.58s"><rect x="0.75" y="0.75" width="266.5" height="168.5" rx="8" fill="#0A0D10" stroke="#262E36" stroke-width="1.5"/><text x="12" y="19" font-size="11" letter-spacing="1.4" fill="#FFB300">NETCODE</text><text x="256" y="19" font-size="9" letter-spacing="0.8" fill="#46525E" text-anchor="end">60 TICK/S</text><rect x="12" y="32" width="244" height="108" fill="#05070A" stroke="#1E262E"/><line x1="134" y1="36" x2="134" y2="136" stroke="#1E262E" stroke-dasharray="3 5"/><rect x="-2.5" y="-2.5" width="5" height="5" fill="#FFB300" filter="url(#glow)" class="ncball" style="transform:translate(26px,104px)"/><rect x="20" y="-10" width="4" height="20" rx="1" fill="#FFB300" class="ncpl" style="transform:translateY(86px)"/><rect x="244" y="-10" width="4" height="20" rx="1" fill="#FFB300" class="ncpr" style="transform:translateY(86px)"/><rect x="244" y="-10" width="4" height="20" rx="1" fill="none" stroke="#FFB300" stroke-dasharray="3 2" opacity="0.5" class="ncpr nclag" style="transform:translateY(86px)"/><text x="12" y="158" font-size="10" fill="#46525E">prediction, rollback, interpolation</text></g>
<rect x="1" y="1" width="266" height="168" rx="10" fill="url(#scan)" opacity="0.14"/>
</svg>