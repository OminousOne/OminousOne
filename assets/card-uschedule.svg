<svg xmlns="http://www.w3.org/2000/svg" width="404" height="170" viewBox="0 0 404 170" role="img" aria-label="uschedule.ca, live: a timetable builder for uOttawa students with preference-based conflict-free schedule generation, professor ratings, and calendar export.">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes cus0{0%,5%{opacity:0}9%,86%{opacity:1}93%,100%{opacity:0}}
.cus0{animation:cus0 10s linear infinite;}
