<svg xmlns="http://www.w3.org/2000/svg" width="830" height="64" viewBox="0 0 830 64" role="img" aria-label="uschedule.ca banner with course blocks filling a timetable">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes bus0{0%,5%{opacity:0}9%,86%{opacity:1}93%,100%{opacity:0}}
.bus0{animation:bus0 10s linear infinite;}
@keyframes bus1{0%,11%{opacity:0}15%,86%{opacity:1}93%,100%{opacity:0}}
.bus1{animation:bus1 10s linear infinite;}
@keyframes bus2{0%,17%{opacity:0}21%,86%{opacity:1}93%,100%{opacity:0}}
.bus2{animation:bus2 10s linear infinite;}
@keyframes bus3{0%,23%{opacity:0}27%,86%{opacity:1}93%,100%{opacity:0}}
.bus3{animation:bus3 10s linear infinite;}
@keyframes bus4{0%,29%{opacity:0}33%,86%{opacity:1}93%,100%{opacity:0}}
.bus4{animation:bus4 10s linear infinite;}
@keyframes bus5{0%,35%{opacity:0}39%,86%{opacity:1}93%,100%{opacity:0}}
.bus5{animation:bus5 10s linear infinite;}
@keyframes bus6{0%,41%{opacity:0}45%,86%{opacity:1}93%,100%{opacity:0}}
.bus6{animation:bus6 10s linear infinite;}
@keyframes bus7{0%,47%{opacity:0}51%,86%{opacity:1}93%,100%{opacity:0}}
.bus7{animation:bus7 10s linear infinite;}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<rect x="0.75" y="0.75" width="828.5" height="62.5" rx="8" fill="#0E1116" stroke="#262E36" stroke-width="1.5"/><text x="18" y="39" font-size="14" letter-spacing="2" fill="#FFB300">USCHEDULE.CA</text><text x="812" y="39" font-size="10" letter-spacing="1" fill="#46525E" text-anchor="end">LIVE</text><g transform="translate(-118,0)"><rect x="560" y="16" width="34" height="14" rx="2" fill="#FFB300" fill-opacity="0.28" stroke="#FFB300" stroke-opacity="0.8" class="bus0"/><rect x="600" y="16" width="34" height="14" rx="2" fill="#FFB300" fill-opacity="0.28" stroke="#FFB300" stroke-opacity="0.8" class="bus1"/><rect x="640" y="16" width="34" height="14" rx="2" fill="#FFB300" fill-opacity="0.28" stroke="#FFB300" stroke-opacity="0.8" class="bus2"/><rect x="680" y="16" width="34" height="14" rx="2" fill="#FFB300" fill-opacity="0.28" stroke="#FFB300" stroke-opacity="0.8" class="bus3"/><rect x="560" y="34" width="34" height="14" rx="2" fill="#FFB300" fill-opacity="0.28" stroke="#FFB300" stroke-opacity="0.8" class="bus4"/><rect x="600" y="34" width="34" height="14" rx="2" fill="#FFB300" fill-opacity="0.28" stroke="#FFB300" stroke-opacity="0.8" class="bus5"/><rect x="640" y="34" width="34" height="14" rx="2" fill="#FFB300" fill-opacity="0.28" stroke="#FFB300" stroke-opacity="0.8" class="bus6"/><rect x="680" y="34" width="34" height="14" rx="2" fill="#FFB300" fill-opacity="0.28" stroke="#FFB300" stroke-opacity="0.8" class="bus7"/></g>
<rect x="1" y="1" width="828" height="62" rx="10" fill="url(#scan)" opacity="0.14"/>
</svg>