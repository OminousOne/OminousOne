<svg xmlns="http://www.w3.org/2000/svg" width="830" height="64" viewBox="0 0 830 64" role="img" aria-label="NAV Canada simulator banner with a sweeping radar">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes bnav{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes bnb0{0%,86.111%{opacity:0}89.111%{opacity:1}99%,100%{opacity:0}}
.bnb0{animation:bnb0 5s linear infinite;}
@keyframes bnb1{0%,52.778%{opacity:0}55.778%{opacity:1}99%,100%{opacity:0}}
.bnb1{animation:bnb1 5s linear infinite;}
@keyframes bnb2{0%,20.833%{opacity:0}23.833%{opacity:1}70.833%,100%{opacity:0}}
.bnb2{animation:bnb2 5s linear infinite;}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<rect x="0.75" y="0.75" width="828.5" height="62.5" rx="8" fill="#0E1116" stroke="#262E36" stroke-width="1.5"/><text x="18" y="39" font-size="14" letter-spacing="2" fill="#FFB300">NAV CANADA SIMULATOR</text><text x="812" y="39" font-size="10" letter-spacing="1" fill="#46525E" text-anchor="end">AIR TRAFFIC CONTROL</text><g transform="translate(-118,0)"><circle cx="700" cy="32" r="10" fill="none" stroke="#2A333C"/><circle cx="700" cy="32" r="19" fill="none" stroke="#2A333C"/><circle cx="700" cy="32" r="28" fill="none" stroke="#2A333C"/><line x1="700" y1="32" x2="728" y2="32" stroke="#FFB300" stroke-width="1.1" opacity="0.85" style="animation:bnav 5s linear infinite;transform-origin:700px 32px"/><rect x="712.341" y="13.347" width="3.6" height="3.6" fill="#FFB300" class="bnb0"/><rect x="682.443" y="27.422" width="3.6" height="3.6" fill="#FFB300" class="bnb1"/><rect x="704.67" y="54.348" width="3.6" height="3.6" fill="#FFB300" class="bnb2"/></g>
<rect x="1" y="1" width="828" height="62" rx="10" fill="url(#scan)" opacity="0.14"/>
</svg>