<svg xmlns="http://www.w3.org/2000/svg" width="268" height="170" viewBox="0 0 268 170" role="img" aria-label="By the numbers: 360,173 lines of code in active projects, 11.7 contributions per active day, 119 on the busiest day.">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes numin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<rect x="0.75" y="0.75" width="266.5" height="168.5" rx="8" fill="#0A0D10" stroke="#262E36" stroke-width="1.5"/><text x="12" y="19" font-size="11" letter-spacing="1.4" fill="#FFB300">BY THE NUMBERS</text><text x="256" y="19" font-size="9" letter-spacing="0.8" fill="#46525E" text-anchor="end">MISC</text><g style="animation:numin .5s cubic-bezier(.3,.6,.3,1) both;animation-delay:0s"><text x="16" y="62" font-size="17" fill="#FFB300">360,173</text><text x="16" y="77" font-size="9.5" fill="#46525E">lines of code in active projects</text></g><g style="animation:numin .5s cubic-bezier(.3,.6,.3,1) both;animation-delay:0.15s"><text x="16" y="102" font-size="17" fill="#FFB300">11.7</text><text x="16" y="117" font-size="9.5" fill="#46525E">contributions per active day</text></g><g style="animation:numin .5s cubic-bezier(.3,.6,.3,1) both;animation-delay:0.3s"><text x="16" y="142" font-size="17" fill="#FFB300">119</text><text x="16" y="157" font-size="9.5" fill="#46525E">contributions on the busiest day</text></g>
<rect x="1" y="1" width="266" height="168" rx="10" fill="url(#scan)" opacity="0.14"/>
</svg>