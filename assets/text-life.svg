<svg xmlns="http://www.w3.org/2000/svg" width="830" height="88" viewBox="0 0 830 88" role="img" aria-label="I made Conway's Game of Life run inside Minecraft as a teenager. Now it runs inside my GitHub profile, and you are all gardening it.">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes bootrev{0%{opacity:0}30%{opacity:.8}55%{opacity:.15}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<g style="animation:bootrev .5s linear both;animation-delay:7.4s"><rect x="0.75" y="0.75" width="828.5" height="86.5" rx="8" fill="#0E1116" stroke="#262E36" stroke-width="1.5"/><text x="22" y="34" font-size="12.5" fill="#6C7986">I made Conway's Game of Life run inside Minecraft as a teenager.</text><text x="22" y="53" font-size="12.5" fill="#6C7986">Now it runs inside my GitHub profile, and you are all gardening it.</text><rect x="1" y="1" width="828" height="86" rx="10" fill="url(#scan)" opacity="0.14"/></g>

</svg>