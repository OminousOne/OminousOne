<svg xmlns="http://www.w3.org/2000/svg" width="412" height="170" viewBox="-4 0 412 170" role="img" aria-label="Multiplayer netcode: client prediction, server reconciliation, and interpolation in C#, plus Kubernetes game servers. Click to play pong with simulated lag and toggleable client prediction.">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes cnc{0%{transform:translate(172px,132px)}25%{transform:translate(240px,108px)}50%{transform:translate(378px,126px)}75%{transform:translate(290px,140px)}100%{transform:translate(172px,132px)}}
.cnc{animation:cnc 4.6s linear infinite;}
@keyframes cncl{0%,100%{transform:translateY(128px)}40%{transform:translateY(112px)}}
@keyframes cncr{0%,100%{transform:translateY(120px)}50%{transform:translateY(128px)}}
@keyframes bootrev{0%{opacity:0}30%{opacity:.8}55%{opacity:.15}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<g style="animation:bootrev .5s linear both;animation-delay:5.1s"><rect x="0.75" y="0.75" width="402.5" height="168.5" rx="8" fill="#19161D" stroke="#51444F" stroke-width="1.5"/><path d="M12 28h380" stroke="#38313C"/><path d="M12 28h26" stroke="#FFC164" stroke-width="1.5"/><text x="12" y="20" font-size="12" font-weight="700" letter-spacing=".8" fill="#FFC164">MULTIPLAYER NETCODE</text><text x="392" y="20" font-size="9" fill="#A79E95" text-anchor="end">C# · KUBERNETES</text><text x="16" y="48" font-size="10.5" fill="#C0B7AD">Multiplayer networking from scratch in C#: prediction,</text><text x="16" y="66" font-size="10.5" fill="#C0B7AD">reconciliation, and interpolation, so games feel instant</text><text x="16" y="84" font-size="10.5" fill="#C0B7AD">while the server stays in charge of the truth.</text><rect x="160" y="102" width="230" height="42" fill="#111017" stroke="#38313C"/><line x1="275" y1="106" x2="275" y2="140" stroke="#38313C" stroke-dasharray="2 4"/><rect x="-2" y="-2" width="4" height="4" fill="#FFC164" class="cnc" style="transform:translate(172px,132px)"/><rect x="166" y="-7" width="3" height="14" fill="#FFC164" style="animation:cncl 4.6s ease-in-out infinite;transform:translateY(128px)"/><rect x="383" y="-7" width="3" height="14" fill="#FFC164" style="animation:cncr 4.6s ease-in-out infinite;transform:translateY(120px)"/><text x="16" y="158" font-size="10" fill="#A79E95">insert coin: play pong with real lag ↗</text><rect x="1" y="1" width="402" height="168" rx="8" fill="url(#scan)" opacity="0.10"/></g>

</svg>