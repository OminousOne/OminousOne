<svg xmlns="http://www.w3.org/2000/svg" width="268" height="170" viewBox="0 0 268 170" role="img" aria-label="uschedule.ca: a timetable assembling itself. Links to uschedule.ca.">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes uspulse{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes usb0{0%,6%{opacity:0}10%,86%{opacity:1}92%,100%{opacity:0}}
.usb0{animation:usb0 11s linear infinite;}
@keyframes usb1{0%,13%{opacity:0}17%,86%{opacity:1}92%,100%{opacity:0}}
.usb1{animation:usb1 11s linear infinite;}
@keyframes usb2{0%,20%{opacity:0}24%,86%{opacity:1}92%,100%{opacity:0}}
.usb2{animation:usb2 11s linear infinite;}
@keyframes usb3{0%,27%{opacity:0}31%,86%{opacity:1}92%,100%{opacity:0}}
.usb3{animation:usb3 11s linear infinite;}
@keyframes usb4{0%,34%{opacity:0}38%,86%{opacity:1}92%,100%{opacity:0}}
.usb4{animation:usb4 11s linear infinite;}
@keyframes usb5{0%,41%{opacity:0}45%,86%{opacity:1}92%,100%{opacity:0}}
.usb5{animation:usb5 11s linear infinite;}
@keyframes usb6{0%,48%{opacity:0}52%,86%{opacity:1}92%,100%{opacity:0}}
.usb6{animation:usb6 11s linear infinite;}
@keyframes usb7{0%,55%{opacity:0}59%,86%{opacity:1}92%,100%{opacity:0}}
