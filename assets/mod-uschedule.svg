@keyframes pwr{0%{opacity:0}18%{opacity:.85}38%{opacity:.15}62%{opacity:1}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<g style="animation:pwr .55s linear both;animation-delay:0.26s"><rect x="0.75" y="0.75" width="266.5" height="168.5" rx="8" fill="#0A0D10" stroke="#262E36" stroke-width="1.5"/><text x="12" y="19" font-size="11" letter-spacing="1.4" fill="#FFB300">USCHEDULE.CA</text><text x="256" y="19" font-size="9" letter-spacing="0.8" fill="#46525E" text-anchor="end">LIVE ↗</text><circle cx="208" cy="15.5" r="3" fill="#FFB300" style="animation:uspulse 2s ease-in-out infinite"/><rect x="12" y="34" width="45" height="112" fill="#05070A" stroke="#1E262E"/><rect x="60" y="34" width="45" height="112" fill="#05070A" stroke="#1E262E"/><rect x="108" y="34" width="45" height="112" fill="#05070A" stroke="#1E262E"/><rect x="156" y="34" width="45" height="112" fill="#05070A" stroke="#1E262E"/><rect x="204" y="34" width="45" height="112" fill="#05070A" stroke="#1E262E"/><rect x="15" y="59" width="39" height="39" rx="2" fill="#FFB300" fill-opacity="0.28" stroke="#FFB300" stroke-opacity="0.85" class="usb0" opacity="1"/><rect x="111" y="36" width="39" height="16" rx="2" fill="#FFB300" fill-opacity="0.28" stroke="#FFB300" stroke-opacity="0.85" class="usb1" opacity="1"/><rect x="63" y="105" width="39" height="39" rx="2" fill="#FFB300" fill-opacity="0.28" stroke="#FFB300" stroke-opacity="0.85" class="usb2" opacity="1"/><rect x="159" y="59" width="39" height="39" rx="2" fill="#FFB300" fill-opacity="0.28" stroke="#FFB300" stroke-opacity="0.85" class="usb3" opacity="1"/><rect x="207" y="105" width="39" height="16" rx="2" fill="#FFB300" fill-opacity="0.28" stroke="#FFB300" stroke-opacity="0.85" class="usb4" opacity="1"/><rect x="111" y="82" width="39" height="39" rx="2" fill="#FFB300" fill-opacity="0.28" stroke="#FFB300" stroke-opacity="0.85" class="usb5" opacity="1"/><rect x="15" y="128" width="39" height="16" rx="2" fill="#FFB300" fill-opacity="0.28" stroke="#FFB300" stroke-opacity="0.85" class="usb6" opacity="1"/><rect x="207" y="36" width="39" height="39" rx="2" fill="#FFB300" fill-opacity="0.28" stroke="#FFB300" stroke-opacity="0.85" class="usb7" opacity="1"/><text x="12" y="158" font-size="10" fill="#46525E">a timetable assembling itself</text></g>
<rect x="1" y="1" width="266" height="168" rx="10" fill="url(#scan)" opacity="0.14"/>
