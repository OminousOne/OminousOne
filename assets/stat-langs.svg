<svg xmlns="http://www.w3.org/2000/svg" width="268" height="170" viewBox="0 0 268 170" role="img" aria-label="Languages across active repos by lines of code: TypeScript 69 percent, JavaScript 25 percent, Dart 3 percent, GraphQL 1 percent.">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes din{from{opacity:0;transform:rotate(-40deg)}to{opacity:1;transform:rotate(0deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<rect x="0.75" y="0.75" width="266.5" height="168.5" rx="8" fill="#0A0D10" stroke="#262E36" stroke-width="1.5"/><text x="12" y="19" font-size="11" letter-spacing="1.4" fill="#FFB300">LANGUAGES</text><text x="256" y="19" font-size="9" letter-spacing="0.8" fill="#46525E" text-anchor="end">ACTIVE REPOS</text><g style="animation:din .9s cubic-bezier(.3,.6,.3,1) both;transform-origin:64px 96px"><circle cx="64" cy="96" r="34" fill="none" stroke="#FFB300" stroke-opacity="1.0" stroke-width="11" stroke-dasharray="144.976 68.652" stroke-dashoffset="-0" transform="rotate(-90 64 96)"/><circle cx="64" cy="96" r="34" fill="none" stroke="#FFB300" stroke-opacity="0.45" stroke-width="11" stroke-dasharray="50.766 162.862" stroke-dashoffset="-146.976" transform="rotate(-90 64 96)"/><circle cx="64" cy="96" r="34" fill="none" stroke="#FFB300" stroke-opacity="0.3" stroke-width="11" stroke-dasharray="4.622 209.006" stroke-dashoffset="-199.742" transform="rotate(-90 64 96)"/><circle cx="64" cy="96" r="34" fill="none" stroke="#FFB300" stroke-opacity="0.2" stroke-width="11" stroke-dasharray="1 212.628" stroke-dashoffset="-206.365" transform="rotate(-90 64 96)"/><circle cx="64" cy="96" r="34" fill="none" stroke="#2A333C" stroke-width="11" stroke-dasharray="2.486 211.142" stroke-dashoffset="-209.142" transform="rotate(-90 64 96)"/></g><text x="64" y="100" font-size="12" fill="#FFB300" text-anchor="middle">69%</text><rect x="128" y="48" width="9" height="9" rx="2" fill="#FFB300" opacity="1.0"/><text x="144" y="56" font-size="10.5" fill="#6C7986">typescript <tspan fill="#46525E">69%</tspan></text><rect x="128" y="72" width="9" height="9" rx="2" fill="#FFB300" opacity="0.45"/><text x="144" y="80" font-size="10.5" fill="#6C7986">javascript <tspan fill="#46525E">25%</tspan></text><rect x="128" y="96" width="9" height="9" rx="2" fill="#FFB300" opacity="0.3"/><text x="144" y="104" font-size="10.5" fill="#6C7986">dart <tspan fill="#46525E">3%</tspan></text><rect x="128" y="120" width="9" height="9" rx="2" fill="#FFB300" opacity="0.2"/><text x="144" y="128" font-size="10.5" fill="#6C7986">graphql <tspan fill="#46525E">1%</tspan></text><text x="12" y="158" font-size="10" fill="#46525E">by lines of code, repos I work in now</text>
<rect x="1" y="1" width="266" height="168" rx="10" fill="url(#scan)" opacity="0.14"/>
</svg>