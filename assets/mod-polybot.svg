<svg xmlns="http://www.w3.org/2000/svg" width="268" height="170" viewBox="0 0 268 170" role="img" aria-label="Polybot: three trading strategy sparklines. Links to the Polybot section below.">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes pb0led{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes pb0s{from{transform:translateX(0)}to{transform:translateX(-146px)}}
@keyframes pb1led{0%,100%{opacity:1}50%{opacity:.15}}
