<svg xmlns="http://www.w3.org/2000/svg" width="268" height="170" viewBox="0 0 268 170" role="img" aria-label="Reciped: three build progress bars filling. Links to the Reciped section below.">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes rcp0{0%{transform:scaleX(0)}8%{transform:scaleX(0)}34%{transform:scaleX(0.86)}88%{transform:scaleX(0.86)}96%,100%{transform:scaleX(0)}}
.rcp0{animation:rcp0 10s cubic-bezier(.3,.6,.3,1) infinite;}
@keyframes rcp1{0%{transform:scaleX(0)}13.4%{transform:scaleX(0)}39.4%{transform:scaleX(0.76)}88%{transform:scaleX(0.76)}96%,100%{transform:scaleX(0)}}
.rcp1{animation:rcp1 10s cubic-bezier(.3,.6,.3,1) infinite;}
@keyframes rcp2{0%{transform:scaleX(0)}18.8%{transform:scaleX(0)}44.8%{transform:scaleX(0.44)}88%{transform:scaleX(0.44)}96%,100%{transform:scaleX(0)}}
.rcp2{animation:rcp2 10s cubic-bezier(.3,.6,.3,1) infinite;}
@keyframes rcpcur{0%,49%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<rect x="0.75" y="0.75" width="266.5" height="168.5" rx="8" fill="#0A0D10" stroke="#262E36" stroke-width="1.5"/><text x="12" y="19" font-size="11" letter-spacing="1.4" fill="#FFB300">RECIPED</text><text x="256" y="19" font-size="9" letter-spacing="0.8" fill="#46525E" text-anchor="end">IN DEV</text><text x="12" y="52" font-size="10.5" fill="#6C7986">api</text><rect x="62" y="44" width="172" height="8" rx="2" fill="#1B222A"/><rect x="62" y="44" width="172" height="8" rx="2" fill="#FFB300" opacity="0.9" class="rcp0" style="transform:scaleX(0.86);transform-origin:62px 0"/><text x="12" y="82" font-size="10.5" fill="#6C7986">web</text><rect x="62" y="74" width="172" height="8" rx="2" fill="#1B222A"/><rect x="62" y="74" width="172" height="8" rx="2" fill="#FFB300" opacity="0.9" class="rcp1" style="transform:scaleX(0.76);transform-origin:62px 0"/><text x="12" y="112" font-size="10.5" fill="#6C7986">mobile</text><rect x="62" y="104" width="172" height="8" rx="2" fill="#1B222A"/><rect x="62" y="104" width="172" height="8" rx="2" fill="#FFB300" opacity="0.9" class="rcp2" style="transform:scaleX(0.44);transform-origin:62px 0"/><rect x="62" y="134" width="6" height="11" fill="#FFB300" style="animation:rcpcur 1.1s steps(1) infinite"/><text x="12" y="144" font-size="10" fill="#46525E">next up</text>
<rect x="1" y="1" width="266" height="168" rx="10" fill="url(#scan)" opacity="0.14"/>
</svg>