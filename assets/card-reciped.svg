<svg xmlns="http://www.w3.org/2000/svg" width="830" height="150" viewBox="0 0 830 150" role="img" aria-label="Reciped, in development: a social recipe app with recipe import, one GraphQL API, a Next.js web app, a Flutter mobile app, and local language model parsing.">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes crc0{0%,6%{transform:scaleX(0)}30%,88%{transform:scaleX(0.86)}96%,100%{transform:scaleX(0)}}
.crc0{animation:crc0 9s cubic-bezier(.3,.6,.3,1) infinite;}
@keyframes crc1{0%,11%{transform:scaleX(0)}35%,88%{transform:scaleX(0.76)}96%,100%{transform:scaleX(0)}}
.crc1{animation:crc1 9s cubic-bezier(.3,.6,.3,1) infinite;}
@keyframes crc2{0%,16%{transform:scaleX(0)}40%,88%{transform:scaleX(0.44)}96%,100%{transform:scaleX(0)}}
.crc2{animation:crc2 9s cubic-bezier(.3,.6,.3,1) infinite;}
@keyframes bootrev{0%{opacity:0}30%{opacity:.8}55%{opacity:.15}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<g style="animation:bootrev .5s linear both;animation-delay:7.3s"><rect x="0.75" y="0.75" width="828.5" height="148.5" rx="8" fill="#0A0D10" stroke="#262E36" stroke-width="1.5"/><text x="12" y="19" font-size="11" letter-spacing="1.4" fill="#FFB300">RECIPED</text><text x="818" y="19" font-size="9" letter-spacing="0.8" fill="#46525E" text-anchor="end">IN DEVELOPMENT</text><text x="16" y="48" font-size="10.5" fill="#6C7986">My current focus: a social recipe app. Import a recipe from any website,</text><text x="16" y="66" font-size="10.5" fill="#6C7986">keep your collection in one place, and share what you cook. One GraphQL API</text><text x="16" y="84" font-size="10.5" fill="#6C7986">serves the Next.js web app and the Flutter app, with a local LLM parsing recipes.</text><text x="656" y="62" font-size="9.5" fill="#46525E" text-anchor="end">api</text><rect x="666" y="56" width="124" height="5" rx="2" fill="#1B222A"/><rect x="666" y="56" width="124" height="5" rx="2" fill="#FFB300" opacity="0.9" class="crc0" style="transform:scaleX(0.86);transform-origin:666px 0"/><text x="656" y="78" font-size="9.5" fill="#46525E" text-anchor="end">web</text><rect x="666" y="72" width="124" height="5" rx="2" fill="#1B222A"/><rect x="666" y="72" width="124" height="5" rx="2" fill="#FFB300" opacity="0.9" class="crc1" style="transform:scaleX(0.76);transform-origin:666px 0"/><text x="656" y="94" font-size="9.5" fill="#46525E" text-anchor="end">mobile</text><rect x="666" y="88" width="124" height="5" rx="2" fill="#1B222A"/><rect x="666" y="88" width="124" height="5" rx="2" fill="#FFB300" opacity="0.9" class="crc2" style="transform:scaleX(0.44);transform-origin:666px 0"/><text x="16" y="138" font-size="10" fill="#46525E">the repo stays private until launch</text><rect x="1" y="1" width="828" height="148" rx="10" fill="url(#scan)" opacity="0.14"/></g>

</svg>