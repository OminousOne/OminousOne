<svg xmlns="http://www.w3.org/2000/svg" width="830" height="100" viewBox="0 0 830 100" role="img" aria-label="Timeline from the beginning to now: blender games, then unity and c sharp, minecraft plugins overlapping them, then uOttawa with gadget running alongside it into the present.">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes erabar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes eralbl{from{opacity:0}to{opacity:1}}
@keyframes nowpulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<rect x="0.75" y="0.75" width="828.5" height="98.5" rx="8" fill="#0E1116" stroke="#262E36" stroke-width="1.5"/><line x1="24" y1="74" x2="806" y2="74" stroke="#1E262E"/><line x1="806" y1="10" x2="806" y2="74" stroke="#2A333C" stroke-dasharray="2 4"/><rect x="24" y="12" width="132.94" height="20" rx="4" fill="#FFB300" fill-opacity="0.14" stroke="#FFB300" stroke-opacity="0.55" style="animation:erabar .7s cubic-bezier(.3,.6,.3,1) both;animation-delay:0.15s;transform-origin:24px 0"/><text x="33" y="26" font-size="10.5" fill="#FFB300" style="animation:eralbl .4s both;animation-delay:0.5s">blender games</text><rect x="125.66" y="40" width="242.42" height="20" rx="4" fill="#FFB300" fill-opacity="0.14" stroke="#FFB300" stroke-opacity="0.55" style="animation:erabar .7s cubic-bezier(.3,.6,.3,1) both;animation-delay:0.293s;transform-origin:125.66px 0"/><text x="134.66" y="54" font-size="10.5" fill="#FFB300" style="animation:eralbl .4s both;animation-delay:0.643s">unity + c#</text><rect x="242.96" y="12" width="312.8" height="20" rx="4" fill="#FFB300" fill-opacity="0.14" stroke="#FFB300" stroke-opacity="0.55" style="animation:erabar .7s cubic-bezier(.3,.6,.3,1) both;animation-delay:0.458s;transform-origin:242.96px 0"/><text x="251.96" y="26" font-size="10.5" fill="#FFB300" style="animation:eralbl .4s both;animation-delay:0.808s">minecraft plugins</text><rect x="508.84" y="40" width="297.16" height="20" rx="4" fill="#FFB300" fill-opacity="0.14" stroke="#FFB300" stroke-opacity="0.55" style="animation:erabar .7s cubic-bezier(.3,.6,.3,1) both;animation-delay:0.832s;transform-origin:508.84px 0"/><text x="517.84" y="54" font-size="10.5" fill="#FFB300" style="animation:eralbl .4s both;animation-delay:1.182s">uottawa</text><rect x="633.96" y="12" width="172.04" height="20" rx="4" fill="#FFB300" fill-opacity="0.14" stroke="#FFB300" stroke-opacity="0.55" style="animation:erabar .7s cubic-bezier(.3,.6,.3,1) both;animation-delay:1.008s;transform-origin:633.96px 0"/><text x="642.96" y="26" font-size="10.5" fill="#FFB300" style="animation:eralbl .4s both;animation-delay:1.358s">gadget</text><text x="24" y="92" font-size="10" fill="#46525E">the beginning</text><circle cx="772" cy="88.5" r="3" fill="#FFB300" style="animation:nowpulse 2s ease-in-out infinite"/><text x="806" y="92" font-size="10" fill="#6C7986" text-anchor="end">now</text>
<rect x="1" y="1" width="828" height="98" rx="10" fill="url(#scan)" opacity="0.14"/>
</svg>