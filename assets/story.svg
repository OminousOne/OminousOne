<svg xmlns="http://www.w3.org/2000/svg" width="830" height="64" viewBox="0 0 830 64" role="img" aria-label="Timeline: blender games, minecraft plugins, unity and c sharp, uOttawa, gadget, reciped">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes stline{0%{transform:scaleX(0)}82%,100%{transform:scaleX(1)}}
@keyframes stpulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<rect x="0.75" y="0.75" width="828.5" height="62.5" rx="8" fill="#0E1116" stroke="#262E36" stroke-width="1.5"/><line x1="40" y1="28" x2="790" y2="28" stroke="#1E262E"/><line x1="40" y1="28" x2="790" y2="28" stroke="#FFB300" stroke-opacity="0.5" style="animation:stline 9s linear infinite;transform-origin:40px 0"/><circle cx="40" cy="28" r="3.2" fill="#FFB300" style="animation:stpulse 9s ease-in-out infinite;animation-delay:0s;opacity:.35"/><text x="24" y="50" font-size="10.5" fill="#6C7986" text-anchor="start">blender games</text><circle cx="190" cy="28" r="3.2" fill="#FFB300" style="animation:stpulse 9s ease-in-out infinite;animation-delay:1.5s;opacity:.35"/><text x="190" y="50" font-size="10.5" fill="#6C7986" text-anchor="middle">minecraft plugins</text><circle cx="340" cy="28" r="3.2" fill="#FFB300" style="animation:stpulse 9s ease-in-out infinite;animation-delay:3s;opacity:.35"/><text x="340" y="50" font-size="10.5" fill="#6C7986" text-anchor="middle">unity + c#</text><circle cx="490" cy="28" r="3.2" fill="#FFB300" style="animation:stpulse 9s ease-in-out infinite;animation-delay:4.5s;opacity:.35"/><text x="490" y="50" font-size="10.5" fill="#6C7986" text-anchor="middle">uottawa</text><circle cx="640" cy="28" r="3.2" fill="#FFB300" style="animation:stpulse 9s ease-in-out infinite;animation-delay:6s;opacity:.35"/><text x="640" y="50" font-size="10.5" fill="#6C7986" text-anchor="middle">gadget</text><circle cx="790" cy="28" r="3.2" fill="#FFB300" style="animation:stpulse 9s ease-in-out infinite;animation-delay:7.5s;opacity:.35"/><text x="806" y="50" font-size="10.5" fill="#6C7986" text-anchor="end">reciped</text>
<rect x="1" y="1" width="828" height="62" rx="10" fill="url(#scan)" opacity="0.14"/>
</svg>