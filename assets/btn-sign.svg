<svg xmlns="http://www.w3.org/2000/svg" width="184" height="36" viewBox="0 0 184 36" role="img" aria-label="Sign the guestbook">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes bootrev{0%{opacity:0}30%{opacity:.8}55%{opacity:.15}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<g style="animation:bootrev .5s linear both;animation-delay:4.8s"><rect x="0.75" y="0.75" width="182.5" height="34.5" rx="5" fill="#211B24" stroke="#DABAFB" stroke-opacity=".55"/><path d="M11 13l5 5-5 5" fill="none" stroke="#DABAFB" stroke-width="1.8"/><text x="27" y="23" font-size="13" font-weight="700" fill="#DABAFB">Sign the guestbook</text><rect x="1" y="1" width="182" height="34" rx="8" fill="url(#scan)" opacity="0.10"/></g>

</svg>