<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.45" stop-color="#08142E"/>
      <stop offset="1" stop-color="#150724"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(235 95) rotate(48) scale(420 240)">
      <stop stop-color="#00F5FF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(990 410) rotate(145) scale(430 260)">
      <stop stop-color="#B026FF" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#B026FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="118" y1="87" x2="1080" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DF9FF"/>
      <stop offset="0.5" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#FF4FD8"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hardGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.49 0 0 0 0 0.98 0 0 0 0 1 0 0 0 1 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" stroke="#7DF9FF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      @keyframes drift { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
      @keyframes drift2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(12px,-10px)} }
      @keyframes pulse { 0%,100%{opacity:.42} 50%{opacity:1} }
      @keyframes dash { to { stroke-dashoffset: -90; } }
      @keyframes scan { 0%{transform:translateY(-530px)} 100%{transform:translateY(530px)} }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes hue { 0%,100%{filter:hue-rotate(0deg)} 50%{filter:hue-rotate(55deg)} }
      .float { animation: drift 5s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
      .float2 { animation: drift2 7s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      .packet { stroke-dasharray: 18 70; animation: dash 2.8s linear infinite; }
      .scan { animation: scan 4.5s linear infinite; }
      .cursor { animation: blink 1s steps(2) infinite; }
      .hue { animation: hue 6s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="560" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="34" fill="url(#glowA)"/>
  <rect width="1200" height="560" rx="34" fill="url(#glowB)"/>
  <rect x="24" y="24" width="1152" height="512" rx="28" fill="url(#grid)" opacity="0.9"/>

  <g opacity="0.36">
    <path d="M70 392 C230 260 326 444 492 295 S824 172 1125 255" stroke="#7DF9FF" stroke-width="2" stroke-dasharray="12 18" class="packet"/>
    <path d="M80 165 C242 122 374 235 506 188 C660 134 787 90 1110 145" stroke="#B026FF" stroke-width="2" stroke-dasharray="14 22" class="packet"/>
    <path d="M120 480 C328 392 392 511 565 432 C720 360 876 433 1088 352" stroke="#FF4FD8" stroke-width="2" stroke-dasharray="16 20" class="packet"/>
  </g>

  <g class="hue" filter="url(#hardGlow)">
    <text x="78" y="178" class="sans" font-size="76" font-weight="900" letter-spacing="-3" fill="#7DF9FF" opacity="0.28">JULIEN</text>
    <text x="74" y="174" class="sans" font-size="76" font-weight="900" letter-spacing="-3" fill="#FF4FD8" opacity="0.24">JULIEN</text>
    <text x="76" y="176" class="sans" font-size="76" font-weight="900" letter-spacing="-3" fill="#FFFFFF">JULIEN</text>
    <text x="77" y="248" class="sans" font-size="76" font-weight="900" letter-spacing="-3" fill="url(#neon)">DEWOLFE</text>
  </g>

  <text x="81" y="294" class="mono" font-size="20" fill="#A7F3FF">distributed systems / realtime networking / full-stack engineering</text>
  <text x="81" y="326" class="mono" font-size="16" fill="#8BA4C9">started in Blender at 9 → unlocked Unity/C# → now building infrastructure that survives chaos</text>

  <g class="float">
    <rect x="77" y="366" width="337" height="116" rx="18" fill="#091224" fill-opacity="0.82" stroke="#7DF9FF" stroke-opacity="0.42"/>
    <circle cx="103" cy="394" r="7" fill="#FF5F57"/><circle cx="126" cy="394" r="7" fill="#FFBD2E"/><circle cx="149" cy="394" r="7" fill="#28C840"/>
    <text x="101" y="429" class="mono" font-size="15" fill="#7DF9FF">$ deploy --target impossible</text>
    <text x="101" y="456" class="mono" font-size="15" fill="#C9D1D9">status: shipping anyway</text>
    <rect x="289" y="444" width="9" height="18" fill="#7DF9FF" class="cursor"/>
  </g>

  <g transform="translate(760 77)" class="float2">
    <circle cx="165" cy="165" r="126" stroke="#7DF9FF" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="165" cy="165" r="83" stroke="#B026FF" stroke-opacity="0.18" stroke-width="2"/>
    <circle cx="165" cy="165" r="42" stroke="#FF4FD8" stroke-opacity="0.22" stroke-width="2"/>
    <path d="M40 165H290M165 40V290M76 76L254 254M254 76L76 254" stroke="#7DF9FF" stroke-opacity="0.12"/>
    <g filter="url(#softGlow)">
      <circle cx="165" cy="165" r="13" fill="#FFFFFF"/>
      <circle cx="85" cy="96" r="8" fill="#7DF9FF" class="pulse"/>
      <circle cx="251" cy="134" r="8" fill="#FF4FD8" class="pulse"/>
      <circle cx="126" cy="260" r="8" fill="#B026FF" class="pulse"/>
      <circle cx="213" cy="239" r="5" fill="#7DF9FF" class="pulse"/>
    </g>
    <text x="122" y="344" class="mono" font-size="13" fill="#A7F3FF">REALTIME SYSTEM RADAR</text>
  </g>

  <g transform="translate(708 376)">
    <rect width="386" height="82" rx="18" fill="#08111F" fill-opacity="0.72" stroke="#B026FF" stroke-opacity="0.36"/>
    <text x="24" y="33" class="mono" font-size="14" fill="#7DF9FF">ACTIVE QUEST</text>
    <text x="24" y="58" class="sans" font-size="22" font-weight="800" fill="#FFFFFF">make boring software feel legendary</text>
  </g>

  <rect y="0" width="1200" height="85" fill="#FFFFFF" opacity="0.035" class="scan"/>
  <rect x="1" y="1" width="1198" height="558" rx="34" stroke="url(#neon)" stroke-opacity="0.55" stroke-width="2"/>
</svg>
