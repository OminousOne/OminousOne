<svg xmlns="http://www.w3.org/2000/svg" width="410" height="170" viewBox="0 0 410 170" role="img" aria-label="Streaks: longest streak 24 days, 139 active days of 366, most commits land on mondays.">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes od0_0{from{transform:translateY(0)}to{transform:translateY(-69px)}}
@keyframes od0_1{from{transform:translateY(0)}to{transform:translateY(-138px)}}
@keyframes od1_0{from{transform:translateY(0)}to{transform:translateY(-34.5px)}}
@keyframes od1_1{from{transform:translateY(0)}to{transform:translateY(-103.5px)}}
@keyframes od1_2{from{transform:translateY(0)}to{transform:translateY(-310.5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<rect x="0.75" y="0.75" width="408.5" height="168.5" rx="8" fill="#0A0D10" stroke="#262E36" stroke-width="1.5"/><text x="12" y="19" font-size="11" letter-spacing="1.4" fill="#FFB300">STREAKS</text><text x="398" y="19" font-size="9" letter-spacing="0.8" fill="#46525E" text-anchor="end">PAST YEAR</text><text x="16" y="52" font-size="11" fill="#6C7986">longest streak</text><clipPath id="od0_0c"><rect x="15" y="64" width="20.6" height="34"/></clipPath><g clip-path="url(#od0_0c)"><g style="animation:od0_0 0.9s steps(2) both;animation-delay:0.1s"><text x="16" y="92" font-size="30" fill="#FFB300">0</text><text x="16" y="126.5" font-size="30" fill="#FFB300">1</text><text x="16" y="161" font-size="30" fill="#FFB300">2</text></g></g><clipPath id="od0_1c"><rect x="33.6" y="64" width="20.6" height="34"/></clipPath><g clip-path="url(#od0_1c)"><g style="animation:od0_1 0.9s steps(4) both;animation-delay:0.25s"><text x="34.6" y="92" font-size="30" fill="#FFB300">0</text><text x="34.6" y="126.5" font-size="30" fill="#FFB300">1</text><text x="34.6" y="161" font-size="30" fill="#FFB300">2</text><text x="34.6" y="195.5" font-size="30" fill="#FFB300">3</text><text x="34.6" y="230" font-size="30" fill="#FFB300">4</text></g></g><text x="62" y="92" font-size="11" fill="#46525E">days in a row</text><text x="216" y="52" font-size="11" fill="#6C7986">active days</text><clipPath id="od1_0c"><rect x="215" y="64" width="20.6" height="34"/></clipPath><g clip-path="url(#od1_0c)"><g style="animation:od1_0 0.9s steps(1) both;animation-delay:0.1s"><text x="216" y="92" font-size="30" fill="#FFB300">0</text><text x="216" y="126.5" font-size="30" fill="#FFB300">1</text></g></g><clipPath id="od1_1c"><rect x="233.6" y="64" width="20.6" height="34"/></clipPath><g clip-path="url(#od1_1c)"><g style="animation:od1_1 0.9s steps(3) both;animation-delay:0.25s"><text x="234.6" y="92" font-size="30" fill="#FFB300">0</text><text x="234.6" y="126.5" font-size="30" fill="#FFB300">1</text><text x="234.6" y="161" font-size="30" fill="#FFB300">2</text><text x="234.6" y="195.5" font-size="30" fill="#FFB300">3</text></g></g><clipPath id="od1_2c"><rect x="252.2" y="64" width="20.6" height="34"/></clipPath><g clip-path="url(#od1_2c)"><g style="animation:od1_2 0.9s steps(9) both;animation-delay:0.4s"><text x="253.2" y="92" font-size="30" fill="#FFB300">0</text><text x="253.2" y="126.5" font-size="30" fill="#FFB300">1</text><text x="253.2" y="161" font-size="30" fill="#FFB300">2</text><text x="253.2" y="195.5" font-size="30" fill="#FFB300">3</text><text x="253.2" y="230" font-size="30" fill="#FFB300">4</text><text x="253.2" y="264.5" font-size="30" fill="#FFB300">5</text><text x="253.2" y="299" font-size="30" fill="#FFB300">6</text><text x="253.2" y="333.5" font-size="30" fill="#FFB300">7</text><text x="253.2" y="368" font-size="30" fill="#FFB300">8</text><text x="253.2" y="402.5" font-size="30" fill="#FFB300">9</text></g></g><text x="281" y="92" font-size="11" fill="#46525E">of 366</text><text x="16" y="128" font-size="12" fill="#6C7986">most commits land on <tspan fill="#FFB300">mondays</tspan></text><text x="12" y="158" font-size="10" fill="#46525E">counted from the contribution calendar</text>
<rect x="1" y="1" width="408" height="168" rx="10" fill="url(#scan)" opacity="0.14"/>
</svg>