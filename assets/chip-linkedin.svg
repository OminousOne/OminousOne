<svg xmlns="http://www.w3.org/2000/svg" height="44" role="img" aria-label="julien-dewolfe">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
.compact{display:none}
@media (max-width:154px){.full{display:none}.compact{display:inline}}
@keyframes bootrev{0%{opacity:0}30%{opacity:.8}55%{opacity:.15}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<g style="animation:bootrev .5s linear both;animation-delay:5.1s"><rect x="2.25" y=".75" width="100%" height="42.5" rx="6" fill="#211B24" stroke="#51444F" stroke-width="1.5" style="width:calc(100% - 4.5px)"/><rect x="2.25" y="1.5" width="100%" height="41" rx="5" fill="url(#scan)" opacity=".1" style="width:calc(100% - 4.5px)"/><path d="M33 9v26" stroke="#38313C"/><rect x="12" y="13" width="18" height="18" rx="3.5" fill="none" stroke="#FFC164" stroke-width="1.6"/><text x="21" y="26.5" font-size="11" font-weight="bold" fill="#FFC164" text-anchor="middle">in</text><text class="full" x="40" y="26.5" font-size="12.5" fill="#F6E9D0">julien-dewolfe</text><text class="compact" x="37" y="26" font-size="10.5" fill="#F6E9D0">LinkedIn</text></g>

</svg>