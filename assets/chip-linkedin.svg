<svg xmlns="http://www.w3.org/2000/svg" width="210" height="44" viewBox="0 0 210 44" role="img" aria-label="julien-dewolfe">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes bootrev{0%{opacity:0}30%{opacity:.8}55%{opacity:.15}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<g style="animation:bootrev .5s linear both;animation-delay:7.5s"><rect x="0.75" y="0.75" width="208.5" height="42.5" rx="5" fill="#0A0D10" stroke="#FFB300" stroke-opacity="0.45"/><path d="M6 11 V6 H11 M199 6 H204 V11 M204 33 V38 H199 M11 38 H6 V33" fill="none" stroke="#FFB300" stroke-opacity="0.7" stroke-width="1.4"/><rect x="14" y="13" width="18" height="18" rx="3.5" fill="none" stroke="#FFB300" stroke-width="1.6"/><text x="23" y="26.5" font-size="11" font-weight="bold" fill="#FFB300" text-anchor="middle">in</text><text x="42" y="26.5" font-size="12.5" fill="#FFB300">julien-dewolfe</text><rect x="1" y="1" width="208" height="42" rx="10" fill="url(#scan)" opacity="0.14"/></g>

</svg>