<svg xmlns="http://www.w3.org/2000/svg" width="830" height="64" viewBox="0 0 830 64" role="img" aria-label="Reciped banner with three build progress bars">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes brc0{0%,6%{transform:scaleX(0)}30%,88%{transform:scaleX(0.86)}96%,100%{transform:scaleX(0)}}
.brc0{animation:brc0 9s cubic-bezier(.3,.6,.3,1) infinite;}
@keyframes brc1{0%,11%{transform:scaleX(0)}35%,88%{transform:scaleX(0.76)}96%,100%{transform:scaleX(0)}}
.brc1{animation:brc1 9s cubic-bezier(.3,.6,.3,1) infinite;}
@keyframes brc2{0%,16%{transform:scaleX(0)}40%,88%{transform:scaleX(0.44)}96%,100%{transform:scaleX(0)}}
.brc2{animation:brc2 9s cubic-bezier(.3,.6,.3,1) infinite;}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<rect x="0.75" y="0.75" width="828.5" height="62.5" rx="8" fill="#0E1116" stroke="#262E36" stroke-width="1.5"/><text x="18" y="39" font-size="14" letter-spacing="2" fill="#FFB300">RECIPED</text><text x="812" y="39" font-size="10" letter-spacing="1" fill="#46525E" text-anchor="end">IN DEVELOPMENT</text><g transform="translate(-118,0)"><rect x="560" y="20" width="150" height="4" rx="1.5" fill="#1B222A"/><rect x="560" y="20" width="150" height="4" rx="1.5" fill="#FFB300" opacity="0.9" class="brc0" style="transform:scaleX(0.86);transform-origin:560px 0"/><rect x="560" y="29" width="150" height="4" rx="1.5" fill="#1B222A"/><rect x="560" y="29" width="150" height="4" rx="1.5" fill="#FFB300" opacity="0.9" class="brc1" style="transform:scaleX(0.76);transform-origin:560px 0"/><rect x="560" y="38" width="150" height="4" rx="1.5" fill="#1B222A"/><rect x="560" y="38" width="150" height="4" rx="1.5" fill="#FFB300" opacity="0.9" class="brc2" style="transform:scaleX(0.44);transform-origin:560px 0"/></g>
<rect x="1" y="1" width="828" height="62" rx="10" fill="url(#scan)" opacity="0.14"/>
</svg>