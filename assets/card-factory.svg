<svg xmlns="http://www.w3.org/2000/svg" width="404" height="170" viewBox="0 0 404 170" role="img" aria-label="Software Factory: AI agents working as a dev team, with a manager, workers, and a reviewer, delivering results as pull requests.">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes csf{0%{transform:translateX(198px);opacity:0}6%{opacity:1}30%{transform:translateX(218px)}45%{transform:translateX(262px)}66%{transform:translateX(282px)}80%{transform:translateX(326px)}92%{transform:translateX(346px);opacity:1}100%{opacity:0}}
.csf{animation:csf 4.5s linear infinite;}
@keyframes bootrev{0%{opacity:0}30%{opacity:.8}55%{opacity:.15}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<g style="animation:bootrev .5s linear both;animation-delay:7.3s"><rect x="0.75" y="0.75" width="402.5" height="168.5" rx="8" fill="#0A0D10" stroke="#262E36" stroke-width="1.5"/><text x="12" y="19" font-size="11" letter-spacing="1.4" fill="#FFB300">SOFTWARE FACTORY</text><text x="392" y="19" font-size="9" letter-spacing="0.8" fill="#46525E" text-anchor="end">AI DEV PIPELINE</text><text x="16" y="48" font-size="10.5" fill="#6C7986">AI agents working as a small dev team. A manager plans</text><text x="16" y="66" font-size="10.5" fill="#6C7986">the work, workers write the code, a reviewer checks it,</text><text x="16" y="84" font-size="10.5" fill="#6C7986">and the results come back to me as pull requests.</text><rect x="154" y="114" width="44" height="20" rx="3" fill="#05070A" stroke="#2A333C"/><text x="176" y="127" font-size="9" fill="#6C7986" text-anchor="middle">plan</text><rect x="218" y="114" width="44" height="20" rx="3" fill="#05070A" stroke="#2A333C"/><text x="240" y="127" font-size="9" fill="#6C7986" text-anchor="middle">code</text><rect x="282" y="114" width="44" height="20" rx="3" fill="#05070A" stroke="#2A333C"/><text x="304" y="127" font-size="9" fill="#6C7986" text-anchor="middle">review</text><rect x="346" y="114" width="44" height="20" rx="3" fill="#05070A" stroke="#2A333C"/><text x="368" y="127" font-size="9" fill="#6C7986" text-anchor="middle">PR</text><line x1="198" y1="124" x2="218" y2="124" stroke="#232B33"/><line x1="262" y1="124" x2="282" y2="124" stroke="#232B33"/><line x1="326" y1="124" x2="346" y2="124" stroke="#232B33"/><circle cy="124" r="2.4" fill="#FFB300" class="csf" opacity="0"/><text x="16" y="158" font-size="10" fill="#46525E">personal tool · private repo</text></g>
<rect x="1" y="1" width="402" height="168" rx="10" fill="url(#scan)" opacity="0.14"/>
</svg>