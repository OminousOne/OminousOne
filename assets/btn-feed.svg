<svg xmlns="http://www.w3.org/2000/svg" width="140" height="36" viewBox="0 0 140 36" role="img" aria-label="feed blob">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes bootrev{0%{opacity:0}30%{opacity:.8}55%{opacity:.15}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<g style="animation:bootrev .5s linear both;animation-delay:7.5s"><rect x="0.75" y="0.75" width="138.5" height="34.5" rx="4" fill="#0E1116" stroke="#FFB300" stroke-opacity="0.45"/><path d="M5 9 V5 H9 M131 5 H135 V9 M135 27 V31 H131 M9 31 H5 V27" fill="none" stroke="#FFB300" stroke-opacity="0.7" stroke-width="1.4"/><text x="70" y="22.5" text-anchor="middle" font-size="13" fill="#FFB300">[ feed blob ]</text><rect x="1" y="1" width="138" height="34" rx="10" fill="url(#scan)" opacity="0.14"/></g>

</svg>