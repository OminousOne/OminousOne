<svg xmlns="http://www.w3.org/2000/svg" width="446" height="218" viewBox="-4 0 446 218" role="img" aria-label="Realtime Game Networking. Server-authoritative rollback architecture for a 3D game, with client prediction, server reconciliation, and entity interpolation.">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes snapshot{0%,12%{transform:translateX(0);opacity:0}20%{opacity:1}72%{transform:translateX(-73px);opacity:1}88%,100%{transform:translateX(-73px);opacity:0}}
@keyframes bootrev{0%{opacity:0}30%{opacity:.8}55%{opacity:.15}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
