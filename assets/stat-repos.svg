<svg xmlns="http://www.w3.org/2000/svg" width="268" height="170" viewBox="0 0 268 170" role="img" aria-label="Commits by repo: reciped leads with 667, then software-factory, uschedule, gadget, polybot.">
<style><![CDATA[
