<svg xmlns="http://www.w3.org/2000/svg" width="268" height="170" viewBox="0 0 268 170" role="img" aria-label="Commits by weekday: Monday is the biggest day, weekends get 23 percent.">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes wbar{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<rect x="0.75" y="0.75" width="266.5" height="168.5" rx="8" fill="#0A0D10" stroke="#262E36" stroke-width="1.5"/><text x="12" y="19" font-size="11" letter-spacing="1.4" fill="#FFB300">WEEKDAYS</text><text x="256" y="19" font-size="9" letter-spacing="0.8" fill="#46525E" text-anchor="end">COMMITS</text><rect x="26" y="48" width="22" height="74" rx="2" fill="#FFB300" opacity="1" style="animation:wbar .55s cubic-bezier(.3,.6,.3,1) both;animation-delay:0s;transform-origin:0px 122px"/><text x="37.0" y="136" font-size="8" fill="#46525E" text-anchor="middle">m</text><rect x="57" y="71.803" width="22" height="50.197" rx="2" fill="#FFB300" opacity="0.642" style="animation:wbar .55s cubic-bezier(.3,.6,.3,1) both;animation-delay:0.06s;transform-origin:0px 122px"/><text x="68.0" y="136" font-size="8" fill="#46525E" text-anchor="middle">t</text><rect x="88" y="73.426" width="22" height="48.574" rx="2" fill="#FFB300" opacity="0.634" style="animation:wbar .55s cubic-bezier(.3,.6,.3,1) both;animation-delay:0.12s;transform-origin:0px 122px"/><text x="99.0" y="136" font-size="8" fill="#46525E" text-anchor="middle">w</text><rect x="119" y="62.336" width="22" height="59.664" rx="2" fill="#FFB300" opacity="0.685" style="animation:wbar .55s cubic-bezier(.3,.6,.3,1) both;animation-delay:0.18s;transform-origin:0px 122px"/><text x="130.0" y="136" font-size="8" fill="#46525E" text-anchor="middle">t</text><rect x="150" y="81.27" width="22" height="40.73" rx="2" fill="#FFB300" opacity="0.599" style="animation:wbar .55s cubic-bezier(.3,.6,.3,1) both;animation-delay:0.24s;transform-origin:0px 122px"/><text x="161.0" y="136" font-size="8" fill="#46525E" text-anchor="middle">f</text><rect x="181" y="84.516" width="22" height="37.484" rx="2" fill="#FFB300" opacity="0.584" style="animation:wbar .55s cubic-bezier(.3,.6,.3,1) both;animation-delay:0.3s;transform-origin:0px 122px"/><text x="192.0" y="136" font-size="8" fill="#46525E" text-anchor="middle">s</text><rect x="212" y="75.59" width="22" height="46.41" rx="2" fill="#FFB300" opacity="0.625" style="animation:wbar .55s cubic-bezier(.3,.6,.3,1) both;animation-delay:0.36s;transform-origin:0px 122px"/><text x="223.0" y="136" font-size="8" fill="#46525E" text-anchor="middle">s</text><text x="12" y="158" font-size="10" fill="#46525E">mondays lead · weekends get 23%</text>
<rect x="1" y="1" width="266" height="168" rx="10" fill="url(#scan)" opacity="0.14"/>
</svg>