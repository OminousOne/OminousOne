<svg xmlns="http://www.w3.org/2000/svg" width="276" height="170" viewBox="-4 0 276 170" role="img" aria-label="Worldmesh. An entity is handed between server groups in a shared multiplayer world.">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes mesh-send{0%,13%{transform:translate(0,0)}40%{transform:translate(63px,0)}69%{transform:translate(122px,0)}85%,100%{transform:translate(0,0)}}
@keyframes mesh-owner{0%,40%,90%,100%{fill:#8CE7D0}45%,85%{fill:#F2C887}}
@keyframes bootrev{0%{opacity:0}30%{opacity:.8}55%{opacity:.15}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<g style="animation:bootrev .5s linear both;animation-delay:5.06s">
<rect x="0.75" y="0.75" width="266.5" height="168.5" rx="8" fill="#211B24" stroke="#51444F" stroke-width="1.5"/>
<rect x="9" y="34" width="250" height="107" rx="4" fill="#142D2E" stroke="#8CE7D0" stroke-opacity=".38"/>
<path d="M10 40v-5h22m204 105h22v-5" fill="none" stroke="#8CE7D0" stroke-opacity=".68"/>
<text x="13" y="23" font-size="15" font-weight="700" fill="#F6E9D0">Worldmesh</text>
<g style="--art-start:5.06s">
<circle cx="134" cy="88" r="42" fill="#173436" stroke="#4D8B83"/>
<ellipse cx="134" cy="88" rx="19" ry="42" fill="none" stroke="#416D68"/>
<path d="M93 88h82m-74-21q33 22 66 0m-66 42q33-22 66 0" fill="none" stroke="#416D68"/>
<path d="M55 88h158" stroke="#8CE7D0" stroke-opacity=".62" stroke-dasharray="3 4"/>
<g fill="#234744" stroke="#72A49D">
  <rect x="23" y="67" width="29" height="35" rx="3"/><rect x="216" y="67" width="29" height="35" rx="3"/>
</g>
<path d="M28 76h19m-19 8h19m-19 8h19m174-16h19m-19 8h19m-19 8h19" stroke="#9ACFC4"/>
<g font-size="9.5" text-anchor="middle">
  <text x="38" y="120" fill="#8CE7D0">Group A</text><text x="230" y="120" fill="#F2C887">Group B</text>
</g>
<circle cx="73" cy="88" r="4" fill="#8CE7D0" stroke="#E7F6E9" stroke-width="1"
  style="animation:mesh-send 5s ease-in-out var(--art-start) infinite, mesh-owner 5s steps(1) var(--art-start) infinite"/>
</g>
<text x="13" y="158" font-size="10.5" fill="#8CE7D0">Read the networking docs</text>
<path d="M241 154h13m-5-4 5 4-5 4" fill="none" stroke="#8CE7D0" stroke-width="1.2"/>
<rect x="1" y="1" width="266" height="168" rx="8" fill="url(#scan)" opacity="0.10"/></g>

</svg>