<svg width="1200" height="470" viewBox="0 0 1200 470" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/><stop offset="0.55" stop-color="#0B1025"/><stop offset="1" stop-color="#170B25"/>
    </linearGradient>
    <linearGradient id="wire" x1="114" y1="235" x2="1090" y2="235" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DF9FF"/><stop offset="0.5" stop-color="#B026FF"/><stop offset="1" stop-color="#FF4FD8"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#7DF9FF" opacity="0.12"/></pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
      @keyframes flow{to{stroke-dashoffset:-180}} @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}} @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      .flow{stroke-dasharray:22 58;animation:flow 3s linear infinite}.blink{animation:blink 2s ease-in-out infinite}.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    </style>
  </defs>
  <rect width="1200" height="470" rx="30" fill="url(#panel)"/>
  <rect width="1200" height="470" rx="30" fill="url(#dots)"/>
  <text x="54" y="70" class="sans" font-size="34" font-weight="900" fill="#fff">Multiplayer Systems Lab</text>
  <text x="55" y="100" class="mono" font-size="15" fill="#8BA4C9">A profile card disguised as an architecture diagram — because the fun part is making packets move.</text>

  <path d="M160 240 C258 158 335 156 430 224 S610 326 720 236 S905 130 1035 225" stroke="url(#wire)" stroke-width="4" opacity="0.35"/>
  <path d="M160 240 C258 158 335 156 430 224 S610 326 720 236 S905 130 1035 225" stroke="#7DF9FF" stroke-width="4" class="flow" filter="url(#glow)"/>
  <path d="M238 330 C372 255 472 381 586 293 S780 257 953 334" stroke="url(#wire)" stroke-width="3" opacity="0.24"/>
  <path d="M238 330 C372 255 472 381 586 293 S780 257 953 334" stroke="#FF4FD8" stroke-width="3" class="flow" filter="url(#glow)"/>

  <g class="bob">
    <rect x="70" y="180" width="180" height="110" rx="18" fill="#0B172A" stroke="#7DF9FF" stroke-opacity="0.55"/>
    <text x="100" y="224" class="sans" font-size="25" font-weight="800" fill="#fff">CLIENTS</text>
    <text x="97" y="255" class="mono" font-size="13" fill="#7DF9FF">input • prediction</text>
  </g>
  <g class="bob" style="animation-delay:.4s">
    <rect x="340" y="160" width="190" height="118" rx="18" fill="#0B172A" stroke="#B026FF" stroke-opacity="0.58"/>
    <text x="377" y="205" class="sans" font-size="24" font-weight="800" fill="#fff">GATEWAY</text>
    <text x="374" y="236" class="mono" font-size="13" fill="#C084FC">TCP/UDP • routing</text>
  </g>
  <g class="bob" style="animation-delay:.8s">
    <rect x="610" y="184" width="220" height="118" rx="18" fill="#0B172A" stroke="#7DF9FF" stroke-opacity="0.55"/>
    <text x="654" y="229" class="sans" font-size="24" font-weight="800" fill="#fff">SIMULATION</text>
    <text x="653" y="260" class="mono" font-size="13" fill="#7DF9FF">authority • ticks • state</text>
  </g>
  <g class="bob" style="animation-delay:1.2s">
    <rect x="944" y="178" width="180" height="118" rx="18" fill="#0B172A" stroke="#FF4FD8" stroke-opacity="0.58"/>
    <text x="990" y="224" class="sans" font-size="24" font-weight="800" fill="#fff">STATE</text>
    <text x="980" y="255" class="mono" font-size="13" fill="#FF8BE7">Redis • MongoDB</text>
  </g>

  <g transform="translate(76 360)">
    <rect width="1048" height="62" rx="16" fill="#050A14" stroke="#24324D"/>
    <circle cx="32" cy="31" r="8" fill="#28C840" class="blink"/><text x="55" y="37" class="mono" font-size="15" fill="#C9D1D9">latency budget respected</text>
    <circle cx="300" cy="31" r="8" fill="#7DF9FF" class="blink"/><text x="323" y="37" class="mono" font-size="15" fill="#C9D1D9">packets in flight</text>
    <circle cx="540" cy="31" r="8" fill="#B026FF" class="blink"/><text x="563" y="37" class="mono" font-size="15" fill="#C9D1D9">server authoritative</text>
    <circle cx="812" cy="31" r="8" fill="#FF4FD8" class="blink"/><text x="835" y="37" class="mono" font-size="15" fill="#C9D1D9">built to scale</text>
  </g>
  <rect x="1" y="1" width="1198" height="468" rx="30" stroke="url(#wire)" stroke-opacity="0.45" stroke-width="2"/>
</svg>
