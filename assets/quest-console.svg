<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1200" y2="360"><stop stop-color="#070B16"/><stop offset="1" stop-color="#140824"/></linearGradient>
    <linearGradient id="g" x1="40" y1="40" x2="1140" y2="320"><stop stop-color="#7DF9FF"/><stop offset=".5" stop-color="#B026FF"/><stop offset="1" stop-color="#FF4FD8"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}@keyframes fill{from{width:0}to{width:var(--w)}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}.bar{animation:fill 1.8s ease-out both}.p{animation:pulse 2s ease-in-out infinite}</style>
  </defs>
  <rect width="1200" height="360" rx="30" fill="url(#b)"/>
  <rect x="36" y="34" width="1128" height="292" rx="24" fill="#07111F" stroke="url(#g)" stroke-opacity=".5"/>
  <text x="72" y="88" class="sans" font-size="32" font-weight="900" fill="#fff">Quest Console</text>
  <text x="73" y="116" class="mono" font-size="14" fill="#8BA4C9">not a tech stack list — a snapshot of what I like building and why</text>

  <g transform="translate(73 154)">
    <text class="mono" font-size="15" fill="#7DF9FF">LOW-LATENCY MULTIPLAYER</text>
    <rect y="20" width="420" height="12" rx="6" fill="#142033"/><rect y="20" style="--w:356px" class="bar" height="12" rx="6" fill="#7DF9FF" filter="url(#glow)"/>
    <text y="58" class="mono" font-size="15" fill="#B026FF">DISTRIBUTED INFRASTRUCTURE</text>
    <rect y="78" width="420" height="12" rx="6" fill="#142033"/><rect y="78" style="--w:326px" class="bar" height="12" rx="6" fill="#B026FF" filter="url(#glow)"/>
    <text y="116" class="mono" font-size="15" fill="#FF4FD8">PRODUCT-MINDED WEB APPS</text>
    <rect y="136" width="420" height="12" rx="6" fill="#142033"/><rect y="136" style="--w:342px" class="bar" height="12" rx="6" fill="#FF4FD8" filter="url(#glow)"/>
  </g>

  <g transform="translate(585 142)">
    <rect width="510" height="145" rx="18" fill="#050A14" stroke="#24324D"/>
    <text x="24" y="38" class="mono" font-size="16" fill="#7DF9FF">julien@github:~$ cat current_mission.txt</text>
    <text x="24" y="72" class="mono" font-size="15" fill="#C9D1D9">• build systems that feel fast, fair, and reliable</text>
    <text x="24" y="101" class="mono" font-size="15" fill="#C9D1D9">• make student/developer tools less painful</text>
    <text x="24" y="130" class="mono" font-size="15" fill="#C9D1D9">• keep learning in public, one shipped thing at a time</text>
  </g>
  <circle cx="1108" cy="76" r="8" fill="#28C840" class="p"/><text x="1072" y="105" class="mono" font-size="12" fill="#8BA4C9">ONLINE</text>
</svg>
