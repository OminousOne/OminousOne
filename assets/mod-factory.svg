<svg xmlns="http://www.w3.org/2000/svg" width="268" height="170" viewBox="0 0 268 170" role="img" aria-label="Software Factory: work flowing from plan through code to review and a PR. Links to the Software Factory section below.">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes sfp0{0%{transform:translate(66px,92px);opacity:0}4%{opacity:1}22%{transform:translate(106px,40px)}46%{transform:translate(146px,40px);opacity:1}64%{transform:translate(180px,92px);opacity:1}68%{opacity:0}100%{opacity:0}}
.sfp0{animation:sfp0 5.4s linear infinite;animation-delay:0s;}
@keyframes sfp1{0%{transform:translate(66px,92px);opacity:0}4%{opacity:1}22%{transform:translate(106px,80px)}46%{transform:translate(146px,80px);opacity:1}64%{transform:translate(180px,92px);opacity:1}68%{opacity:0}100%{opacity:0}}
.sfp1{animation:sfp1 5.4s linear infinite;animation-delay:1.1s;}
@keyframes sfp2{0%{transform:translate(66px,92px);opacity:0}4%{opacity:1}22%{transform:translate(106px,120px)}46%{transform:translate(146px,120px);opacity:1}64%{transform:translate(180px,92px);opacity:1}68%{opacity:0}100%{opacity:0}}
.sfp2{animation:sfp2 5.4s linear infinite;animation-delay:2.2s;}
@keyframes sfpr{0%,66%{opacity:0;transform:translate(226px,92px)}72%{opacity:1}84%{transform:translate(242px,92px);opacity:1}88%,100%{opacity:0}}
.sfpr{animation:sfpr 5.4s linear infinite;}
@keyframes pwr{0%{opacity:0}18%{opacity:.85}38%{opacity:.15}62%{opacity:1}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<g style="animation:pwr .55s linear both;animation-delay:7.74s"><rect x="0.75" y="0.75" width="266.5" height="168.5" rx="8" fill="#0A0D10" stroke="#262E36" stroke-width="1.5"/><text x="12" y="19" font-size="11" letter-spacing="1.4" fill="#FFB300">SOFTWARE FACTORY</text><text x="256" y="19" font-size="9" letter-spacing="0.8" fill="#46525E" text-anchor="end">AGENTS</text><rect x="20" y="80" width="46" height="24" rx="3" fill="#05070A" stroke="#2A333C"/><text x="43" y="95" font-size="9" fill="#6C7986" text-anchor="middle">plan</text><rect x="106" y="31" width="40" height="18" rx="3" fill="#05070A" stroke="#2A333C"/><text x="126" y="43" font-size="9" fill="#6C7986" text-anchor="middle">code 1</text><rect x="106" y="71" width="40" height="18" rx="3" fill="#05070A" stroke="#2A333C"/><text x="126" y="83" font-size="9" fill="#6C7986" text-anchor="middle">code 2</text><rect x="106" y="111" width="40" height="18" rx="3" fill="#05070A" stroke="#2A333C"/><text x="126" y="123" font-size="9" fill="#6C7986" text-anchor="middle">code 3</text><rect x="180" y="80" width="46" height="24" rx="3" fill="#05070A" stroke="#2A333C"/><text x="203" y="95" font-size="9" fill="#6C7986" text-anchor="middle">review</text><text x="252" y="96" font-size="10" fill="#FFB300" text-anchor="end" opacity="0.9">PR</text><line x1="66" y1="92" x2="106" y2="40" stroke="#232B33"/><line x1="146" y1="40" x2="180" y2="92" stroke="#232B33"/><circle r="2.4" fill="#FFB300" class="sfp0" opacity="0"/><line x1="66" y1="92" x2="106" y2="80" stroke="#232B33"/><line x1="146" y1="80" x2="180" y2="92" stroke="#232B33"/><circle r="2.4" fill="#FFB300" class="sfp1" opacity="0"/><line x1="66" y1="92" x2="106" y2="120" stroke="#232B33"/><line x1="146" y1="120" x2="180" y2="92" stroke="#232B33"/><circle r="2.4" fill="#FFB300" class="sfp2" opacity="0"/><circle r="2.4" fill="#FFB300" class="sfpr" opacity="0"/><text x="12" y="158" font-size="10" fill="#46525E">agents that ship pull requests</text></g>
<rect x="1" y="1" width="266" height="168" rx="10" fill="url(#scan)" opacity="0.14"/>
</svg>