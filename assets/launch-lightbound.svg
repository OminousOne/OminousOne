<svg xmlns="http://www.w3.org/2000/svg" width="446" height="218" viewBox="-4 0 446 218" role="img" aria-label="Lightbound. Fight waves of lost souls while two stats swap every minute. Made for the 2023 GMTK Game Jam.">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes lightbound-ring{from{r:15px;opacity:.8}to{r:43px;opacity:0}}
@keyframes bootrev{0%{opacity:0}30%{opacity:.8}55%{opacity:.15}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<g style="animation:bootrev .5s linear both;animation-delay:4.8s">
<rect x="0.75" y="0.75" width="436.5" height="216.5" rx="9" fill="#211B24" stroke="#51444F" stroke-width="1.5"/>
<rect x="12" y="12" width="414" height="128" rx="5" fill="#231B37" stroke="#C9B7FF" stroke-opacity=".36"/>

<ellipse cx="143" cy="80" rx="111" ry="43" fill="#2B2145" stroke="#594783"/>
<ellipse cx="143" cy="80" rx="79" ry="30" fill="none" stroke="#594783" stroke-dasharray="3 4"/>
<path d="M33 80h220m-110-40v81" stroke="#6B568E" stroke-opacity=".65"/>
<g transform="translate(62 57)"><path d="M-6 7v-7a6 6 0 0 1 12 0v7l-3-3-3 3-3-3z" fill="#67558F" stroke="#8E76C7"/><circle cx="-2" cy="-1" r="1" fill="#C9B7FF"/><circle cx="2" cy="-1" r="1" fill="#C9B7FF"/></g><g transform="translate(177 49)"><path d="M-6 7v-7a6 6 0 0 1 12 0v7l-3-3-3 3-3-3z" fill="#67558F" stroke="#8E76C7"/><circle cx="-2" cy="-1" r="1" fill="#C9B7FF"/><circle cx="2" cy="-1" r="1" fill="#C9B7FF"/></g><g transform="translate(226 82)"><path d="M-6 7v-7a6 6 0 0 1 12 0v7l-3-3-3 3-3-3z" fill="#67558F" stroke="#8E76C7"/><circle cx="-2" cy="-1" r="1" fill="#C9B7FF"/><circle cx="2" cy="-1" r="1" fill="#C9B7FF"/></g><g transform="translate(88 111)"><path d="M-6 7v-7a6 6 0 0 1 12 0v7l-3-3-3 3-3-3z" fill="#67558F" stroke="#8E76C7"/><circle cx="-2" cy="-1" r="1" fill="#C9B7FF"/><circle cx="2" cy="-1" r="1" fill="#C9B7FF"/></g><g transform="translate(186 115)"><path d="M-6 7v-7a6 6 0 0 1 12 0v7l-3-3-3 3-3-3z" fill="#67558F" stroke="#8E76C7"/><circle cx="-2" cy="-1" r="1" fill="#C9B7FF"/><circle cx="2" cy="-1" r="1" fill="#C9B7FF"/></g>
<circle cx="143" cy="80" r="15" fill="none" stroke="#FFD486" stroke-opacity=".7"
        style="animation:lightbound-ring 3.4s ease-out infinite"/>
<path d="M143 72l8 8-8 8-8-8z" fill="#FFD486" filter="url(#glow)"/>
<rect x="267" y="53" width="125" height="57" rx="4" fill="#332A4A" stroke="#715D98"/>
<text x="329" y="71" font-size="10" text-anchor="middle" fill="#C9B7FF">STAT SWAP</text>
<text x="329" y="94" font-size="15" text-anchor="middle" fill="#FFD486">HP ⇄ DMG</text>

<path d="M13 148h412" stroke="#38313C"/>
<path d="M13 148h36" stroke="#C9B7FF" stroke-width="2"/>
<text x="16" y="179" fill="#F6E9D0" font-size="26" font-weight="700">Lightbound</text>
<text x="17" y="203" fill="#C9B7FF" font-size="16">2023 game jam · Survive stat swaps</text>
<path d="M402 198h18m-6-6 6 6-6 6" fill="none" stroke="#C9B7FF" stroke-width="1.5"/>
<rect x="1" y="1" width="436" height="216" rx="8" fill="url(#scan)" opacity="0.10"/></g>

</svg>