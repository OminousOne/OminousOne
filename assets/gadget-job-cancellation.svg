<svg xmlns="http://www.w3.org/2000/svg" width="446" height="218" viewBox="-4 0 446 218" role="img" aria-label="Background job cancellation. Lets users cancel queued jobs by queue, action, or Shopify shop while running jobs finish.">
<style><![CDATA[
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
@keyframes bootrev{0%{opacity:0}30%{opacity:.8}55%{opacity:.15}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
]]></style>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" y="2" fill="#000"/>
  </pattern>
</defs>
<g style="animation:bootrev .5s linear both;animation-delay:4.8s">
<rect x="0.75" y="0.75" width="436.5" height="216.5" rx="9" fill="#211B24" stroke="#51444F" stroke-width="1.5"/>
<rect x="12" y="12" width="414" height="128" rx="5" fill="#33232B" stroke="#FFAD92" stroke-opacity=".36"/>

<rect x="47" y="28" width="344" height="97" rx="4" fill="#34242A" stroke="#7D535B"/>
<text x="61" y="48" font-size="10" fill="#FFAD92">FILTER BY</text>
<g font-size="10" text-anchor="middle" fill="#FFAD92">
  <rect x="128" y="35" width="53" height="18" rx="3" fill="#4C333B"/><text x="154" y="48">Queue</text>
  <rect x="188" y="35" width="62" height="18" rx="3" fill="#4C333B"/><text x="219" y="48">Action</text>
  <rect x="257" y="35" width="52" height="18" rx="3" fill="#4C333B"/><text x="283" y="48">Shop</text>
</g>
<path d="M60 61h318m-318 28h318" stroke="#60434A"/>
<g font-size="11" fill="#E5C9C5">
  <text x="64" y="78">Matching queued jobs</text><text x="64" y="107">Running jobs</text>
</g>
<g font-size="10" text-anchor="end">
  <text x="372" y="78" fill="#FFAD92">Cancel pending</text><text x="372" y="107" fill="#F4CE88">Keep running</text>
</g>

<path d="M13 148h412" stroke="#38313C"/>
<path d="M13 148h36" stroke="#FFAD92" stroke-width="2"/>
<text x="16" y="179" fill="#F6E9D0" font-size="26" font-weight="700">Cancel background jobs</text>
<text x="17" y="203" fill="#FFAD92" font-size="16">Clear queues or cancel matching jobs</text>

<rect x="1" y="1" width="436" height="216" rx="8" fill="url(#scan)" opacity="0.10"/></g>

</svg>