name: guestbook

# Visitors sign the guestbook by opening an issue whose title starts with
# "guestbook:". This workflow sanitizes the message, appends it to
# data/guestbook.json (which /live/guestbook.svg renders), thanks the signer,
# and closes the issue. Issue titles are attacker-controlled text, so all
# handling stays inside github-script; nothing is interpolated into a shell.

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const user = context.payload.issue.user.login;
            const title = context.payload.issue.title || '';
            const body = context.payload.issue.body || '';

            // forgiving matching: people often overwrite the pre-filled title,
            // so accept either the title prefix or the marker in the body
            const prefixed = /^\s*guestbook\s*:/i.test(title);
            const marked = body.includes('guestbook');
            if (!prefixed && !marked) {
              core.info('not a guestbook issue, leaving it alone');
              return;
            }

            let msg = title
              .replace(/^\s*guestbook\s*:/i, '')
              .replace(/[^\w\s.,!?'"()@#&+:\/-]/g, ' ')
              .replace(/\s+/g, ' ')
              .trim()
              .slice(0, 60);
            if (/^your message here$/i.test(msg)) msg = '';

            const blocked = ['fuck', 'shit', 'bitch', 'cunt', 'nigg', 'fagg',
              'porn', 'nazi', 'hitler', 'rape', 'kys', 'kill your',
              'http://', 'https://', 'www.', '.com', '.gg', '.xyz'];
            const lower = msg.toLowerCase();
            const ok = msg.length > 0 && !blocked.some(w => lower.includes(w));

            if (ok) {
              const path = 'data/guestbook.json';
              const file = await github.rest.repos.getContent({ owner, repo, path });
              const entries = JSON.parse(Buffer.from(file.data.content, 'base64').toString());
              entries.push({ user, msg, date: new Date().toISOString().slice(0, 10) });
              while (entries.length > 100) entries.shift();
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path,
                message: `guestbook: ${user} signed`,
                content: Buffer.from(JSON.stringify(entries, null, 1) + '\n').toString('base64'),
                sha: file.data.sha,
              });
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: ok
                ? `Thanks for signing, @${user}! Your message shows up on the page within a few minutes.`
                : `Thanks @${user}, but that message could not be added. Keep it short, plain text, and link-free, then open a new issue to try again.`,
            });
            await github.rest.issues.update({ owner, repo, issue_number, state: 'closed' });
