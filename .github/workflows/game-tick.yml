name: game tick

# The hourly heartbeat of the Fun and games section: BLOB gets hungrier
# and a little bored, and the Life garden advances one Conway generation.
# Both files land in a single commit via the git data API to keep history
# tidy. The boss does not regenerate; damage sticks until it falls.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const paths = ['data/games/boss.json', 'data/games/pet.json', 'data/games/life.json'];

            const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            const baseSha = ref.data.object.sha;
            const baseCommit = await github.rest.git.getCommit({ owner, repo, commit_sha: baseSha });

            const states = {};
            for (const p of paths) {
              const f = await github.rest.repos.getContent({ owner, repo, path: p, ref: baseSha });
              states[p] = JSON.parse(Buffer.from(f.data.content, 'base64').toString());
            }

            const boss = states[paths[0]];

            const pet = states[paths[1]];
            pet.hunger = Math.min(100, pet.hunger + 4);
            pet.mood = Math.max(0, pet.mood - 3);

            const life = states[paths[2]];
            const Wd = 64, Ht = 16;
            const live = new Set(life.cells.map(([x, y]) => x + ',' + y));
            const counts = new Map();
            for (const [x, y] of life.cells) {
              for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
                if (!dx && !dy) continue;
                const k = ((x + dx + Wd) % Wd) + ',' + ((y + dy + Ht) % Ht);
                counts.set(k, (counts.get(k) || 0) + 1);
              }
            }
            const next = [];
            for (const [k, n] of counts) {
              if (n === 3 || (n === 2 && live.has(k))) {
                const [x, y] = k.split(',').map(Number);
                next.push([x, y]);
              }
            }
            next.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
            life.cells = next;
            life.generation += 1;

            // a dead garden reseeds itself with a random methuselah
            if (life.cells.length < 3) {
              const PATTERNS = [
                [[1,0],[2,0],[0,1],[1,1],[1,2]],                                  // r-pentomino
                [[1,0],[3,1],[0,2],[1,2],[4,2],[5,2],[6,2]],                      // acorn
                [[1,0],[2,1],[0,2],[1,2],[2,2]],                                  // glider
                [[1,0],[4,0],[0,1],[0,2],[4,2],[0,3],[1,3],[2,3],[3,3]],          // lwss
              ];
              const pat = PATTERNS[Math.floor(Math.random() * PATTERNS.length)];
              const ox = 4 + Math.floor(Math.random() * 50);
              const oy = 3 + Math.floor(Math.random() * 8);
              for (const [px, py] of pat) life.cells.push([(ox + px) % Wd, (oy + py) % Ht]);
              life.cells.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
              core.info('garden reseeded');
            }

            const tree = await github.rest.git.createTree({
              owner, repo, base_tree: baseCommit.data.tree.sha,
              tree: paths.map(p => ({
                path: p, mode: '100644', type: 'blob',
                content: JSON.stringify(states[p], null, 1) + '\n',
              })),
            });
            const commit = await github.rest.git.createCommit({
              owner, repo, message: `game tick: gen ${life.generation}, boss ${boss.hp} hp, BLOB fed ${100 - pet.hunger}%`,
              tree: tree.data.sha, parents: [baseSha],
            });
            await github.rest.git.updateRef({ owner, repo, ref: 'heads/main', sha: commit.data.sha });
            core.info(`ticked to generation ${life.generation}`);
